project:
  type: book
  output-dir: ../instructor-docs

book:
  title: "Network Science — Instructor Solutions"
  subtitle: "Teaching staff only — do not distribute to students"
  author: "Zahra Rezaei"
  date: last-modified
  chapters:
    - index.qmd
    - solutions/02-graph-theory-solutions.qmd
    - solutions/03-random-graphs-solutions.qmd
    - solutions/04-random-graph-evolution-solutions.qmd
    - solutions/05-small-world-graphs-solutions.qmd
    - solutions/06-scale-free-graphs-solutions.qmd
    - solutions/07-network-robustness-solutions.qmd
    - solutions/08-community-in-graphs-solutions.qmd
  page-navigation: true
  search: true

bibliography: ../references.bib
csl: ../apa.csl

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

format:
  html:
    theme:
      - cosmo
      - ../styles.scss
    page-layout: full
    toc-depth: 3
    toc-location: right
    number-sections: true
    number-depth: 2
    code-copy: true
    code-fold: true
    code-summary: "Show code"
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    html-math-method: katex
    fig-align: center
    format-links:
      - pdf

  pdf:
    documentclass: report
    pdf-engine: xelatex
    latex-auto-install: true
    toc: true
    toc-depth: 3
    number-sections: true
    colorlinks: true
    geometry:
      - margin=1in
    fig-align: center
    fig-width: 6.5
    fig-height: 4.2
    fig-cap-location: bottom

knitr:
  opts_chunk:
    dev: "ragg_png"
